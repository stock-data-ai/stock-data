name: Weekly Valuation (Saturday)

on:
  schedule:
    # Weekly Saturday: Taiwan 09:00 (UTC 01:00)
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task identifier (for rerun chaining)'
        required: false
        default: 'weekly-saturday'
        type: string
      rerun_round:
        description: 'Rerun round (auto-set by self-chaining, 0=initial run)'
        required: false
        default: '0'
        type: string
      delay_minutes:
        description: 'Minutes to wait before start (for API quota reset)'
        required: false
        default: '0'
        type: string
      batch:
        description: 'Batch number (0=all batches, 1-4=specific batch)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Force update even if already updated today'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pipeline:
    uses: ./.github/workflows/_reusable-data-job.yml
    with:
      commands_json: '[{"id":"valuation","cli":"update-valuation","label":"估值"},{"id":"shareholder","cli":"fetch-shareholder-data","label":"TDCC 股權分散"}]'
      artifact_prefix: weekly-saturday
      commit_message: "更新估值+TDCC數據"
      caller_workflow: weekly-valuation.yml
      caller_task: weekly-saturday
      summary_title: "週六更新"
      rerun_round: ${{ inputs.rerun_round || '0' }}
      delay_minutes: ${{ inputs.delay_minutes || '0' }}
      batch: ${{ inputs.batch || '0' }}
      force: ${{ github.event_name == 'schedule' || inputs.force || false }}
    secrets: inherit
