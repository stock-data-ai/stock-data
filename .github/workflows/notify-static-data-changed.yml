name: Notify Static Data Changed

on:
  push:
    branches: [main]
    paths:
      - 'src/data/layer3/companies/companies-all.json'
      - 'src/data/etf/index.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CHIJUI0128/stock_map/dispatches \
            -d '{"event_type":"static-data-changed"}'

      - name: 關閉 fetch_etf_data.py 提醒 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --repo stock-data-ai/stock-data --label reminder --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo stock-data-ai/stock-data --comment "fetch_etf_data.py 已執行，資料同步完成。✅"
          fi
