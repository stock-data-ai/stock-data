name: Generate Disposition Forecast｜生成處置股預警

on:
  workflow_dispatch:

concurrency:
  group: generate-disposition-forecast
  cancel-in-progress: false

permissions:
  contents: write        # 需寫回 notices/ 快照（累積官方真相，供本地 reconcile 對答案）

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 記住抓過的每日價量：第一次冷跑抓一次，之後每天只抓「新的一天」，
      # 避免每次從美國 runner 重抓 60+ 次 TWSE → timeout。key 用 run_id 滾動、restore-keys 取最新。
      - name: Restore/persist 價量 cache
        uses: actions/cache@v4
        with:
          path: |
            finance_tools/disposition/cache
            finance_tools/disposition/predictions
          key: disposition-cache-${{ github.run_id }}
          restore-keys: |
            disposition-cache-

      - name: Generate and push disposition-forecast.json
        env:
          STOCK_MAP_PAT: ${{ secrets.STOCK_MAP_PAT }}
          # 款6 的當日 PE/PB 已於 2026-08-26 改走 FinMind（證交所來函後移除 BWIBBU_d
          # 網頁端點）。沒帶 token 會整批 400 → pb_pe_daily 回 None → 款6 退回較舊的
          # 備援值，預警會靜默失準而不是報錯。
          FINMIND_API_TOKENS: ${{ secrets.FINMIND_API_TOKENS }}
        run: |
          set -o pipefail
          uv run finance_tools/cli.py generate-disposition-forecast 2>&1 | tee /tmp/run.log

      # 官方 notice/notetrans API 只回最新一天、無法回補；漏存一天真相就永遠沒了。
      # 故每日把新快照 commit 回本 repo（後端資料，不影響網站；供本地 reconcile 對答案）。
      - name: 存官方 notice 快照回 repo（累積真相）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finance_tools/disposition/notices/ finance_tools/disposition/forecasts/
          if git diff --cached --quiet; then
            echo "無新 notice 快照，略過"
          else
            git commit -m "chore(disposition): 累積官方 notice 與當日預警快照 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push origin main
          fi

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          AS_OF=$(grep -oP 'as_of=\K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          NONSAFE=$(grep -oP '非safe=\K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 處置股預警生成 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 資料日 as_of | $AS_OF |"
            echo "| 非safe 檔數 | $NONSAFE |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY
