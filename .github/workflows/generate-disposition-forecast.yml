name: Generate Disposition Forecast｜生成處置股預警

on:
  workflow_dispatch:
    inputs:
      force:
        description: "強制執行（略過休市日與「今天已成功就跳過」的檢查）"
        type: boolean
        default: false

concurrency:
  group: generate-disposition-forecast
  cancel-in-progress: false

permissions:
  contents: write        # 需寫回 notices/ 快照（累積官方真相，供本地 reconcile 對答案）
  actions: read          # 備援班要查今天 19:05 那班有沒有成功

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 22:30 那班原本是為了補款7（融資融券 21:30 才公布），但 2026-11-04 盤點：
      # 105 個官方名單日款7 一次都沒出現，19:05 時當天官方注意名單已齊，
      # 連續 6 天兩班輸出完全相同 → 改成**只在今天 19:05 失敗時才補跑**。
      # 證交所休市日（含補假）也跳過：沒有新交易資料，只會重發舊資料、白觸發一次網站部署。
      # 颱風停市不在休市 API 裡，那天照跑（結果與前一天相同，無害）。
      # 跳過的這班仍是 success，health-check 不會誤報。
      - name: 判斷這班要不要跑
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          HOUR=$(TZ=Asia/Taipei date +%H)
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "⏭  $1"; exit 0; }
          if [ "$FORCE" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 休市日：證交所 OpenAPI 休市表（民國日期，如 1151026）。抓不到就照跑，不因檢查失敗而漏班。
          ROC=$(TZ=Asia/Taipei date +%Y%m%d | awk '{printf "%d%s", substr($0,1,4)-1911, substr($0,5)}')
          if curl -fsS --max-time 20 https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule \
               | jq -e --arg d "$ROC" '.[] | select(.Date == $d) | select((.Name | test("市場無交易")) or (.Description | test("放假|補假|休市")))' >/dev/null 2>&1; then
            skip "今天 $TODAY 證交所休市"
          fi
          # 備援班（台灣 21 點後）：今天已有成功的一班就跳過
          if [ "$HOUR" -ge 21 ]; then
            N=$(gh run list -R "$GITHUB_REPOSITORY" -w generate-disposition-forecast.yml --status success -L 20 \
                  --json createdAt,databaseId \
                  --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select((.createdAt | fromdateiso8601 + 28800 | strftime(\"%Y-%m-%d\")) == \"$TODAY\")] | length" || echo 0)
            if [ "${N:-0}" -gt 0 ]; then skip "今天 19:05 已成功，備援班不重跑"; fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: uv sync --all-extras --dev

      # 記住抓過的每日價量：第一次冷跑抓一次，之後每天只抓「新的一天」，
      # 避免每次從美國 runner 重抓 60+ 次 TWSE → timeout。key 用 run_id 滾動、restore-keys 取最新。
      - name: Restore/persist 價量 cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            finance_tools/disposition/cache
            finance_tools/disposition/predictions
          key: disposition-cache-${{ github.run_id }}
          restore-keys: |
            disposition-cache-

      - name: Generate and push disposition-forecast.json
        if: steps.gate.outputs.skip != 'true'
        env:
          STOCK_MAP_PAT: ${{ secrets.STOCK_MAP_PAT }}
          # 款6 的當日 PE/PB 已於 2026-08-26 改走 FinMind（證交所來函後移除 BWIBBU_d
          # 網頁端點）。沒帶 token 會整批 400 → pb_pe_daily 回 None → 款6 退回較舊的
          # 備援值，預警會靜默失準而不是報錯。
          FINMIND_API_TOKENS: ${{ secrets.FINMIND_API_TOKENS }}
        run: |
          set -o pipefail
          uv run finance_tools/cli.py generate-disposition-forecast 2>&1 | tee /tmp/run.log

      # 官方 notice/notetrans API 只回最新一天、無法回補；漏存一天真相就永遠沒了。
      # 故每日把新快照 commit 回本 repo（後端資料，不影響網站；供本地 reconcile 對答案）。
      - name: 存官方 notice 快照回 repo（累積真相）
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finance_tools/disposition/notices/ finance_tools/disposition/forecasts/
          if git diff --cached --quiet; then
            echo "無新 notice 快照，略過"
          else
            git commit -m "chore(disposition): 累積官方 notice 與當日預警快照 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push origin main
          fi

      - name: 執行摘要
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            echo "## 處置股預警生成 — 跳過：${{ steps.gate.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          LOG=/tmp/run.log
          AS_OF=$(grep -oP 'as_of=\K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          NONSAFE=$(grep -oP '非safe=\K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 處置股預警生成 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 資料日 as_of | $AS_OF |"
            echo "| 非safe 檔數 | $NONSAFE |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY
