name: Manual Health Check

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run health check and send report email
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.parse, urllib.request, sys
          from datetime import datetime, timedelta, timezone

          GH_TOKEN     = os.environ['GH_TOKEN']
          BREVO_API_KEY = os.environ['BREVO_API_KEY']
          REPO         = os.environ['REPO']

          # Mirror cron/src/index.ts CHECK_JOBS exactly
          CHECK_JOBS = [
              {'label': '07:00 Economic Daily Scraper', 'workflow_name': 'Economic Daily Scraper｜經濟日報爬蟲', 'hour': 7, 'minute': 0},
              {'label': '16:00 Active ETF Holdings Update (Daily)', 'workflow_name': 'Active ETF Holdings Update (Daily)｜主動型ETF持股（每日）', 'hour': 16, 'minute': 0},
              {'label': '18:30 Daily Update', 'workflow_name': 'Daily Update｜每日更新（市值＋三大法人）', 'hour': 18, 'minute': 30},
              {'label': '19:00 MOPS Scraper', 'workflow_name': 'MOPS Scraper｜公開資訊觀測站爬蟲', 'hour': 19, 'minute': 0},
              {'label': '19:30 Active ETF Holdings Update (Daily)', 'workflow_name': 'Active ETF Holdings Update (Daily)｜主動型ETF持股（每日）', 'hour': 19, 'minute': 30},
              {'label': '21:30 Economic Daily Scraper', 'workflow_name': 'Economic Daily Scraper｜經濟日報爬蟲', 'hour': 21, 'minute': 30},
              {'label': '18:35 Market Sentiment Update', 'workflow_name': 'Market Sentiment Update｜市場情緒更新', 'hour': 18, 'minute': 35, 'days': [1, 2, 3, 4, 5]},
              {'label': '21:00 Market Sentiment Update', 'workflow_name': 'Market Sentiment Update｜市場情緒更新', 'hour': 21, 'minute': 0, 'days': [1, 2, 3, 4, 5]},
              {'label': '週六 08:00 ETF Holdings Update (Weekly)', 'workflow_name': 'ETF Holdings Update (Weekly)｜ETF持股（週更）', 'hour': 8, 'minute': 0, 'days': [6]},
              {'label': '週六 09:00 Weekly Shareholder Update (Saturday)', 'workflow_name': 'Weekly Shareholder Update (Saturday)｜股東結構（週六）', 'hour': 9, 'minute': 0, 'days': [6]},
              {'label': '週六 11:00 Weekly Dividend Update (Saturday)', 'workflow_name': 'Weekly Dividend Update (Saturday)｜股利資料（週六）', 'hour': 11, 'minute': 0, 'days': [6]},
              {'label': '週日 09:00 Weekly Full Update (Sunday)', 'workflow_name': 'Weekly Full Update (Sunday)｜完整財務更新（週日）', 'hour': 9, 'minute': 0, 'days': [0]},
              {'label': '週日 10:00 Update US Financials', 'workflow_name': 'Update US Financials｜美股財務更新', 'hour': 10, 'minute': 0, 'days': [0]},
              {'label': '週日 11:00 Weekly Balance Sheet Update (Monday)', 'workflow_name': 'Weekly Balance Sheet Update (Monday)｜資產負債表（週）', 'hour': 11, 'minute': 0, 'days': [0]},
              {'label': '週一 03:00 Cleanup old workflow runs', 'workflow_name': 'Cleanup old workflow runs｜清理舊 workflow 記錄', 'hour': 3, 'minute': 0, 'days': [1]},
          ]

          now        = datetime.now(timezone.utc)
          taiwan_now = now + timedelta(hours=8)
          tw_date    = taiwan_now.strftime('%Y-%m-%d')
          tw_day     = int(taiwan_now.strftime('%w'))  # 0=Sun 1=Mon … 6=Sat
          tw_start_utc = datetime(
              taiwan_now.year, taiwan_now.month, taiwan_now.day,
              tzinfo=timezone.utc,
          ) - timedelta(hours=8)
          since = tw_start_utc.strftime('%Y-%m-%dT%H:%M:%SZ')
          until = now.strftime('%Y-%m-%dT%H:%M:%SZ')

          # Fetch completed runs created during the current Taiwan day.
          workflow_runs = []
          for page in range(1, 6):
              query = urllib.parse.urlencode({'created': f'{since}..{until}', 'per_page': '100', 'page': str(page)})
              url = f'https://api.github.com/repos/{REPO}/actions/runs?{query}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {GH_TOKEN}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'stock-data-health-check',
              })
              with urllib.request.urlopen(req) as resp:
                  page_runs = json.loads(resp.read())['workflow_runs']
              workflow_runs.extend(page_runs)
              if len(page_runs) < 100:
                  break

          def job_start_utc(job):
              return datetime(
                  taiwan_now.year, taiwan_now.month, taiwan_now.day,
                  job['hour'], job['minute'], tzinfo=timezone.utc,
              ) - timedelta(hours=8)

          required = [job for job in CHECK_JOBS if 'days' not in job or tw_day in job['days']]

          def job_window(job):
              start = job_start_utc(job)
              next_same = sorted(
                  candidate_start
                  for candidate in required
                  if candidate['workflow_name'] == job['workflow_name']
                  for candidate_start in [job_start_utc(candidate)]
                  if candidate_start > start
              )
              return start, next_same[0] if next_same else now

          ok, failed, missing = [], [], []
          for job in required:
              start, end = job_window(job)
              runs = [
                  run for run in workflow_runs
                  if run['name'] == job['workflow_name']
                  and start <= datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')) < end
              ]
              success = next((run for run in runs if run['status'] == 'completed' and run['conclusion'] == 'success'), None)
              completed_failure = next((run for run in runs if run['status'] == 'completed' and run['conclusion'] != 'success'), None)
              if success:
                  ok.append(job['label'])
              elif not runs:
                  missing.append(job['label'])
              elif completed_failure:
                  failed.append(f"{job['label']}\n  {completed_failure['html_url']}")
              else:
                  missing.append(f"{job['label']}（尚未完成）")

          all_good = not failed and not missing
          subject  = f"✅ [{tw_date}] stock_data 更新完成 (手動檢查)" if all_good \
                     else f"⚠️ [{tw_date}] stock_data 更新異常 (手動檢查)"

          body = f"stock_data 健康檢查｜{tw_date}（手動觸發）\n\n"
          if ok:      body += f"✅ 成功 ({len(ok)})\n"  + '\n'.join(f"  • {w}" for w in ok)      + "\n\n"
          if failed:  body += f"❌ 失敗\n"              + '\n'.join(f"  • {w}" for w in failed)   + "\n\n"
          if missing: body += f"⚠️ 未執行\n"            + '\n'.join(f"  • {w}" for w in missing)  + "\n\n"

          print(subject)
          print(body)

          # Send via Brevo
          payload = json.dumps({
              'sender':      {'name': 'Stock Data Cron', 'email': 'noreply@aistockmap.com'},
              'to':          [{'email': 'ricky.wu@whalechip.com'}],
              'subject':     subject,
              'textContent': body,
          }).encode()
          req = urllib.request.Request(
              'https://api.brevo.com/v3/smtp/email',
              data=payload,
              headers={'api-key': BREVO_API_KEY, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req) as resp:
              print(f'Brevo response: {resp.status}')

          if not all_good:
              sys.exit(1)
          PYEOF
