name: Generate Chip Topic｜生成籌碼題材

on:
  workflow_dispatch:

concurrency:
  group: generate-chip-topic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate and push chip-topic.json
        env:
          STOCK_MAP_PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: uv run finance_tools/cli.py generate-chip-topic
