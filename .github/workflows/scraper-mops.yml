name: MOPS Scraper｜公開資訊觀測站爬蟲

on:
  workflow_dispatch:

jobs:
  mops-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run MOPS Scraper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          uv run python Web_Crawler/mops_scraper.py 2>&1 | tee /tmp/run.log

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          DATE_RANGE=$(grep -m1 "日期範圍:" "$LOG" 2>/dev/null | sed 's/.*日期範圍: //' | sed 's/ (.*//' || echo "—")
          COUNT=$(grep "共取得" "$LOG" 2>/dev/null | grep -oP '\d+(?= 筆)' | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 公開資訊觀測站爬蟲 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 日期範圍 | $DATE_RANGE |"
            echo "| 取得公告筆數 | $COUNT |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY
