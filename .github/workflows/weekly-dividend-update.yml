name: Weekly Dividend Update (Saturday)｜股利資料（週六）

on:
  workflow_dispatch:

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dividends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run MOPS dividend update
        env:
          FINMIND_API_TOKENS: ${{ secrets.FINMIND_API_TOKENS }}
        run: uv run finance_tools/cli.py update-dividends

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer3/company-financials/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "股利更新(MOPS) $(date +'%Y-%m-%d')"
            git push
          fi
