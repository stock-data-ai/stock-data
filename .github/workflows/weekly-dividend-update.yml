name: Weekly Dividend Update (Saturday)｜股利資料（週六）

on:
  workflow_dispatch:

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dividends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run MOPS dividend update
        env:
          FINMIND_API_TOKENS: ${{ secrets.FINMIND_API_TOKENS }}
        run: |
          set -o pipefail
          uv run finance_tools/cli.py update-dividends 2>&1 | tee /tmp/run.log

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          # "OK MOPS dividend update: X 更新, Y 跳過（無 JSON）, Z 年份保留 CSV"
          UPDATED=$(grep -oP 'OK MOPS dividend update: \K\d+(?= 更新)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          SKIPPED=$(grep -oP '\d+(?= 跳過)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          KEPT=$(grep -oP '\d+(?= 年份保留)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 股利資料更新 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 更新公司數 | $UPDATED |"
            echo "| 跳過（無 JSON） | $SKIPPED |"
            echo "| 保留 CSV 年份 | $KEPT |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer3/company-financials/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "股利更新(MOPS) $(date +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase -X ours origin main && git push && break
              sleep $((i * 5))
            done
          fi
