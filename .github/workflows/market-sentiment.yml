name: Market Sentiment Update｜市場情緒更新

on:
  workflow_dispatch:

concurrency:
  group: market-sentiment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Update market sentiment
        run: uv run finance_tools/cli.py update-market-sentiment

      - name: Commit sentiment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/sentiment.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每日更新市場情緒數據 $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
