name: Notify ETF Index Changed

on:
  push:
    branches: [main]
    paths:
      - 'src/data/etf/index.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Trigger ETF index sync in stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CHIJUI0128/stock_map/dispatches \
            -d '{"event_type":"etf-index-changed"}'

      - name: 關閉 ETF metadata/index 提醒 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --repo stock-data-ai/stock-data --label reminder --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo stock-data-ai/stock-data --comment "ETF metadata / index 已同步完成。✅"
          fi
