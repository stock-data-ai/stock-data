name: Notify Companies Data Changed

on:
  push:
    branches: [main]
    paths:
      - 'src/data/layer3/companies/companies-all.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger companies sync in stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CHIJUI0128/stock_map/dispatches \
            -d '{"event_type":"companies-data-changed"}'
