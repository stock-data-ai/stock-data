name: Weekly Financials Update (Sunday)｜財務報表更新（週日）

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task identifier (for rerun chaining)'
        required: false
        default: 'weekly-sunday'
        type: string
      rerun_round:
        description: 'Rerun round (auto-set by self-chaining, 0=initial run)'
        required: false
        default: '0'
        type: string
      delay_minutes:
        description: 'Minutes to wait before start (for API quota reset)'
        required: false
        default: '0'
        type: string
      batch:
        description: 'Batch number (0=all batches, 1-4=specific batch)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Force update even if already updated today'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pipeline:
    uses: ./.github/workflows/_reusable-data-job.yml
    with:
      commands_json: '[{"id":"financials_update","cli":"financials-update","label":"財務報表更新"}]'
      artifact_prefix: weekly-financials-update
      commit_message: "財務報表更新"
      caller_workflow: weekly-financials-update.yml
      caller_task: weekly-sunday
      summary_title: "財務報表更新"
      rerun_round: ${{ inputs.rerun_round || '0' }}
      delay_minutes: ${{ inputs.delay_minutes || '0' }}
      batch: ${{ inputs.batch || '0' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
