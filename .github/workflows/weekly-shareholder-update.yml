name: Weekly Shareholder Update (Saturday)｜股東結構（週六）

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if already updated today'
        required: false
        default: true
        type: boolean

concurrency:
  group: data-pipeline-shareholder
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch-tdcc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch TDCC shareholding data
        run: |
          set -o pipefail
          MAX=3
          for attempt in $(seq 1 $MAX); do
            if uv run finance_tools/cli.py fetch-shareholder-data --force 2>&1 | tee /tmp/run.log; then
              break
            fi
            [ $attempt -lt $MAX ] && { echo "Attempt $attempt 失敗，30 秒後重試..."; sleep 30; } || exit 1
          done

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          RESULT=$(grep -oP 'OK 完成: \K\d+/\d+(?= 間)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          WARN_COUNT=$(grep -c "⚠" "$LOG" 2>/dev/null || echo "0")
          {
            echo "## 股東結構更新 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 更新公司數 | $RESULT |"
            echo "| 資料異常跳過 | ${WARN_COUNT} 筆 |"
            echo "| 狀態 | $STATUS |"
            if [ "$WARN_COUNT" -gt 0 ]; then
              echo ""
              echo "### ⚠ 資料品質警示（跳過的公司）"
              echo '```'
              grep "⚠" "$LOG" 2>/dev/null || true
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer3/company-financials/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每週更新 TDCC 股權分散數據 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && break
            sleep $((i * 5))
          done

  compute-big-holders:
    needs: fetch-tdcc
    if: always() && needs.fetch-tdcc.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Compute big holders ranking
        run: |
          set -o pipefail
          uv run finance_tools/cli.py compute-big-holders 2>&1 | tee /tmp/run.log

      - name: 執行摘要
        if: always()
        run: |
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          WRITTEN=$(grep "written →" /tmp/run.log 2>/dev/null | tail -1 | sed 's/.*written → //' || echo "—")
          {
            echo "## 大戶加碼排行計算 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 輸出檔案 | $WRITTEN |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/weekly_big_holders.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "更新大戶加碼排行 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && break
            sleep $((i * 5))
          done
