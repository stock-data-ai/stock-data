name: Weekly Shareholder Update (Saturday)｜股東結構（週六）

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if already updated today'
        required: false
        default: true
        type: boolean
      final:
        description: '本週最後一班：仍失敗就立刻寄信（由 cron worker 帶入，手動跑不用勾）'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline-shareholder
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch-tdcc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch roster｜名單
        uses: ./.github/actions/fetch-roster
        with:
          pat: ${{ secrets.STOCK_MAP_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 下市清除先於抓資料：TDCC 對已終止買賣的個股照發資料，不先刪掉，下面那步會把它們續命。
      # 刪除由「Commit result」的 git add 目錄一起收進 commit。
      - name: Prune delisted｜刪掉已下市的財報檔
        run: |
          set -o pipefail
          uv run finance_tools/cli.py prune-financials 2>&1 | tee /tmp/prune.log

      - name: Fetch TDCC shareholding data
        run: |
          set -o pipefail
          # 間隔逐次拉長（30／45／60 秒）：TDCC 逾時常常一兩分鐘才恢復，固定 30 秒容易三次都撞上。
          # 更久的等待交給 cron worker 的下一班（週六 12:00／16:00、週日 08:30），不在 Actions 裡空等。
          DELAYS=(30 45 60)
          MAX=$(( ${#DELAYS[@]} + 1 ))
          for attempt in $(seq 1 $MAX); do
            if uv run finance_tools/cli.py fetch-shareholder-data --force 2>&1 | tee /tmp/run.log; then
              break
            fi
            grep -q "STALE:" /tmp/run.log && { echo "TDCC 尚未發布新一期，重試無意義，直接失敗。"; exit 1; }
            [ $attempt -lt $MAX ] || exit 1
            wait=${DELAYS[$((attempt - 1))]}
            echo "Attempt $attempt 失敗，${wait} 秒後重試..."
            sleep $wait
          done

      # 內部人持股已拆到 weekly-insider-holdings.yml：2026-10-03 09:30 那班 TDCC 已抓到 10/02
      # 新一期，卻因 TPEx 內部人端點 connection reset 讓這個 job 整個失敗——TDCC 資料沒 commit、
      # compute-big-holders 被跳過，大戶加碼榜停在上一期。月頻資料不可再掛回這條週頻主線。

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          RESULT=$(grep -oP 'OK 完成: \K\d+/\d+(?= 間)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          DATA_DATE=$(grep -oP 'TDCC 資料日期: \K\d{8}' "$LOG" 2>/dev/null | tail -1 || echo "—")
          WARN_COUNT=$(grep -c "⚠" "$LOG" 2>/dev/null || echo "0")
          {
            echo "## 股東結構更新 — $(date -u +%Y-%m-%d)"
            echo ""
            if grep -q "STALE:" "$LOG"; then
              echo "> [!CAUTION]"
              echo "> **TDCC 尚未發布新一期資料，本次未更新任何數據。** 等 TDCC 發布後再手動重跑。"
              echo "> $(grep 'STALE:' "$LOG" | tail -1 | sed 's/.*STALE: //')"
              echo ""
            fi
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| TDCC 資料日期 | $DATA_DATE |"
            echo "| 更新公司數 | $RESULT |"
            echo "| 資料異常跳過 | ${WARN_COUNT} 筆 |"
            echo "| 狀態 | $STATUS |"
            if [ "$WARN_COUNT" -gt 0 ]; then
              echo ""
              echo "### ⚠ 資料品質警示（跳過的公司）"
              echo '```'
              grep "⚠" "$LOG" 2>/dev/null || true
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 財報檔改用 JSON 結構合併（.gitattributes → merge=company-json）：兩個排程同時改同一檔時，
          # 逐行合併可能拼出壞 JSON，或讓 -X ours 把這次寫的資料整段丟掉。見 json_merge_driver.py。
          git config merge.company-json.driver "python3 finance_tools/scripts/json_merge_driver.py %O %A %B"
          git add src/data/layer3/company-financials/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每週更新 TDCC 股權分散數據 $(date -u +%Y-%m-%d)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X ours origin main && git push; then
              pushed=true
              break
            fi
            echo "Retry $i failed, sleeping..."
            sleep $((i * 5))
          done
          if [ "$pushed" != true ]; then
            # 這一行是重點：先前重試失敗後接的是 sleep，步驟結束碼是 0，
            # 於是「資料沒發布出去」變成綠燈，沒有任何人會知道。
            echo "::error::推送失敗三次，TDCC 股權分散資料沒有發布出去"
            git status --short
            exit 1
          fi

  compute-big-holders:
    needs: fetch-tdcc
    if: always() && needs.fetch-tdcc.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Fetch roster｜名單
        uses: ./.github/actions/fetch-roster
        with:
          pat: ${{ secrets.STOCK_MAP_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Compute big holders ranking
        run: |
          set -o pipefail
          uv run finance_tools/cli.py compute-big-holders 2>&1 | tee /tmp/run.log

      - name: 執行摘要
        if: always()
        run: |
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          WRITTEN=$(grep "written →" /tmp/run.log 2>/dev/null | tail -1 | sed 's/.*written → //' || echo "—")
          {
            echo "## 大戶加碼排行計算 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 輸出檔案 | $WRITTEN |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 財報檔改用 JSON 結構合併（.gitattributes → merge=company-json）：兩個排程同時改同一檔時，
          # 逐行合併可能拼出壞 JSON，或讓 -X ours 把這次寫的資料整段丟掉。見 json_merge_driver.py。
          git config merge.company-json.driver "python3 finance_tools/scripts/json_merge_driver.py %O %A %B"
          git add src/data/market/weekly_big_holders.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "更新大戶加碼排行 $(date -u +%Y-%m-%d)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X ours origin main && git push; then
              pushed=true
              break
            fi
            echo "Retry $i failed, sleeping..."
            sleep $((i * 5))
          done
          if [ "$pushed" != true ]; then
            # 這一行是重點：先前重試失敗後接的是 sleep，步驟結束碼是 0，
            # 於是「資料沒發布出去」變成綠燈，沒有任何人會知道。
            echo "::error::推送失敗三次，大戶加碼排行沒有發布出去"
            git status --short
            exit 1
          fi

  # 本週最後一班（cron worker 帶 final=true）仍沒成功就立刻寄信，不等 23:00 健康檢查。
  # 前面幾班失敗不寄：還有下一班會補，寄了只是噪音。
  alert-final-failure:
    needs: [fetch-tdcc, compute-big-holders]
    if: always() && inputs.final && needs.compute-big-holders.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: etf_Crawler

      - name: Send alert email｜寄信
        env:
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TDCC_RESULT: ${{ needs.fetch-tdcc.result }}
          BIG_RESULT: ${{ needs.compute-big-holders.result }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'etf_Crawler')
          from notify_mail import send_mail
          url = os.environ['RUN_URL']
          body = (
              '<p>本週股權分散／大戶加碼排行的<strong>最後一班備援</strong>仍未成功，網站停在上一期。</p>'
              f'<p>fetch-tdcc：{os.environ["TDCC_RESULT"]}<br>compute-big-holders：{os.environ["BIG_RESULT"]}</p>'
              f'<p><a href="{url}">查看這次執行</a>，排除後手動重跑 weekly-shareholder-update.yml。</p>')
          if not send_mail('🚨 大戶加碼排行本週未更新（最後一班仍失敗）', body):
              sys.exit(1)
          PY
