name: Weekly Shareholder Update (Saturday)｜股東結構（週六）

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if already updated today'
        required: false
        default: true
        type: boolean

concurrency:
  group: data-pipeline-shareholder
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch-tdcc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch TDCC shareholding data
        run: uv run finance_tools/cli.py fetch-shareholder-data --force

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer3/company-financials/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每週更新 TDCC 股權分散數據 $(date -u +%Y-%m-%d)"
          git pull --rebase -X ours origin main
          git push

  compute-big-holders:
    needs: fetch-tdcc
    if: always() && needs.fetch-tdcc.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Compute big holders ranking
        run: uv run finance_tools/cli.py compute-big-holders

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/weekly_big_holders.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "更新大戶加碼排行 $(date -u +%Y-%m-%d)"
          git pull --rebase -X ours origin main
          git push
