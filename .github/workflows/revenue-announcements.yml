name: Monthly Revenue｜月營收（公布＋月中核對）

# 月營收只有這一支 workflow，由 cron worker 每天 09:30 派一班（見 cron/src/index.ts）：
#   1～13 號：比對觀測站彙總表，記下新公布的公司與公布日（行事曆「營收」分頁），
#             同時把數字補進財報檔，公司頁同一班就更新
#   15～20 號：開放資料一換到上個月就核對、修正並寄結果信；核對過的月份直接結束，20 號還沒換月就寄信
# 要做哪一件由 `revenue-monthly` 依日期判斷。週日的財報更新（FinMind）照跑，同一個月份以那邊為準覆蓋。
# 全市場基本面快照（選股）不在這裡重建：平日 21:30 融資那班與週日財報更新都會建。
on:
  workflow_dispatch:

concurrency:
  group: revenue-announcements
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 結束碼 3＝核對檔已寫好但結果信寄送失敗：先 commit，最後一步再讓 job 變紅
      - name: Run monthly revenue
        id: run
        env:
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
        run: |
          set +e
          uv run finance_tools/cli.py revenue-monthly 2>&1 | tee /tmp/run.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: 執行摘要
        if: always()
        run: |
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 月營收 — $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
            echo ""
            grep -E '新公布 [0-9]+ 家|沒有新公布或更正|出表 [0-9-]+|財報檔月營收|核對完成|尚未換到|已在 .* 核對過|不在收集|❌' /tmp/run.log \
              | sed 's/.* - INFO - //; s/.* - ERROR - //' | sed 's/^/- /'
            echo ""
            echo "狀態：$STATUS"
          } >> $GITHUB_STEP_SUMMARY

      # 財報檔與平日每日更新（三大法人）寫同一批檔：用 JSON 結構合併，與 _reusable-data-job.yml 同一套
      - name: Commit
        if: always() && (steps.run.outputs.code == '0' || steps.run.outputs.code == '3')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.company-json.driver "python3 finance_tools/scripts/json_merge_driver.py %O %A %B"
          git add src/data/market/revenue-announcements/ src/data/layer3/company-financials/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "月營收 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main; then
              # 最後防線：財報檔合併壞掉就改用遠端版本（下一班 apply 會再補回營收）
              for f in $(git diff --name-only HEAD~1 -- src/data/layer3/company-financials/); do
                python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null || {
                  echo "::warning::$f 合併後不是合法 JSON，改用遠端版本"
                  git show HEAD~1:"$f" > "$f"
                  git add "$f"
                  git commit --amend --no-edit
                }
              done
              git push && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Retry $i failed, sleeping..."
            sleep $((i * 5))
          done
          echo "::error::推送失敗三次，月營收資料沒有發布出去"
          exit 1

      - name: 結果信寄送失敗
        if: steps.run.outputs.code == '3'
        run: |
          echo "::error::核對已完成並 commit，但結果信沒寄出去"
          exit 1
