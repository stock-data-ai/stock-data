name: Active ETF Holdings Update (Daily)

on:
  schedule:
    # Daily (Mon-Fri): Taiwan 19:00 (UTC 11:00) — 收盤後資料更新
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      codes:
        description: '指定 ETF 代碼（空白分隔，留空=全部）'
        required: false
        default: ''
        type: string

concurrency:
  group: etf-active
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run active ETF crawler (統一投信 — 00981A 00988A)
        run: |
          UNIPRES_CODES="00981A 00988A"
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00981A|00988A)$" | tr '\n' ' ' | xargs)
            [ -n "$FILTERED" ] && uv run python etf_Crawler/fetch_active_etf_unipres.py $FILTERED || echo "跳過統一投信（無符合代碼）"
          else
            uv run python etf_Crawler/fetch_active_etf_unipres.py
          fi

      - name: Run active ETF crawler (群益投信 — 00982A 00992A)
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00982A|00992A)$" | tr '\n' ' ' | xargs)
            [ -n "$FILTERED" ] && uv run python etf_Crawler/fetch_active_etf_capital.py $FILTERED || echo "跳過群益投信（無符合代碼）"
          else
            uv run python etf_Crawler/fetch_active_etf_capital.py
          fi

      - name: Commit & push updated ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/etf/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "主動型 ETF 持股更新 $(date +%Y-%m-%d)"
            git push
          fi
