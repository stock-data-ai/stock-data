name: Active ETF Holdings Update (Daily)

on:
  schedule:
    # Mon-Fri: Taiwan 19:00 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      codes:
        description: '指定 ETF 代碼（空白分隔，留空=全部）'
        required: false
        default: ''
        type: string

concurrency:
  group: etf-active
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run active ETF crawler (統一投信 — 00981A 00988A)
        id: unipres
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00981A|00988A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_unipres.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_unipres.py
          fi

      - name: Run active ETF crawler (群益投信 — 00982A 00992A 00997A)
        id: capital
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00982A|00992A|00997A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_capital.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_capital.py
          fi

      - name: Run active ETF crawler (野村投信 — 00980A 00985A)
        id: nomura
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00980A|00985A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_nomura.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_nomura.py
          fi

      - name: Set up Node.js (for 元大投信 NUXT parser)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run active ETF crawler (元大投信 — 00990A)
        id: yuanta
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00990A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_yuanta.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_yuanta.py
          fi

      - name: Run active ETF crawler (中信投信 — 00983A 00995A)
        id: ctbc
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00983A|00995A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_ctbc.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_ctbc.py
          fi

      - name: Run active ETF crawler (復華投信 — 00991A)
        id: fuhwa
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00991A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_fuhwa.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_fuhwa.py
          fi

      - name: Run active ETF crawler (安聯投信 — 00984A 00993A)
        id: allianz
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00984A|00993A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_allianz.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_allianz.py
          fi

      - name: Run active ETF crawler (台新投信 — 00986A 00987A)
        id: taishin
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00986A|00987A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_taishin.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_taishin.py
          fi

      - name: Run active ETF crawler (第一金投信 — 00994A)
        id: first_financial
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00994A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_first_financial.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_first_financial.py
          fi

      - name: Run active ETF crawler (兆豐投信 — 00996A)
        id: mega
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00996A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_mega.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_mega.py
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "## 主動型 ETF 持股更新結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 投信 | ETF | 狀態 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|------|" >> $GITHUB_STEP_SUMMARY

          status() {
            local result=$1
            local skipped=$2
            if [ "$skipped" = "true" ]; then echo "⏭️ 略過"
            elif [ "$result" = "success" ]; then echo "✅ 成功"
            else echo "❌ 失敗"
            fi
          }

          echo "| 統一投信 | 00981A 00988A | $(status '${{ steps.unipres.outcome }}' '${{ steps.unipres.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 群益投信 | 00982A 00992A 00997A | $(status '${{ steps.capital.outcome }}' '${{ steps.capital.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 野村投信 | 00980A 00985A | $(status '${{ steps.nomura.outcome }}' '${{ steps.nomura.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 元大投信 | 00990A | $(status '${{ steps.yuanta.outcome }}' '${{ steps.yuanta.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 中信投信 | 00983A 00995A | $(status '${{ steps.ctbc.outcome }}' '${{ steps.ctbc.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 復華投信 | 00991A | $(status '${{ steps.fuhwa.outcome }}' '${{ steps.fuhwa.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 安聯投信 | 00984A 00993A | $(status '${{ steps.allianz.outcome }}' '${{ steps.allianz.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 台新投信 | 00986A 00987A | $(status '${{ steps.taishin.outcome }}' '${{ steps.taishin.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 第一金投信 | 00994A | $(status '${{ steps.first_financial.outcome }}' '${{ steps.first_financial.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 兆豐投信 | 00996A | $(status '${{ steps.mega.outcome }}' '${{ steps.mega.outputs.SKIPPED }}') |" >> $GITHUB_STEP_SUMMARY

      - name: Sync ETF metadata
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            uv run python etf_Crawler/sync_etf_metadata.py ${{ inputs.codes }}
          else
            uv run python etf_Crawler/sync_etf_metadata.py
          fi

      - name: Generate ETF index from detail files
        run: uv run python etf_Crawler/generate_etf_index.py

      - name: Commit & push updated ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/etf/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "主動型 ETF 持股更新 $(date +%Y-%m-%d)"
            git pull --rebase -X ours origin main
            git push
          fi

      - name: Push generated index.json back to stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          SHA=$(curl -fsSL \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/CHIJUI0128/stock_map/contents/src/data/etf/index.json?ref=publish_cloudflare" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          CONTENT=$(base64 -w 0 src/data/etf/index.json)
          curl -fsSL -X PUT \
            -H "Authorization: token $PAT" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/CHIJUI0128/stock_map/contents/src/data/etf/index.json" \
            -d "{\"message\":\"generate: ETF index 同步 $(date +%Y-%m-%d)\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\",\"branch\":\"publish_cloudflare\"}"
