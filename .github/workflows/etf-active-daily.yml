name: Active ETF Holdings Update (Daily)｜主動型ETF持股（每日）

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '指定 ETF 代碼（空白分隔，留空=全部）'
        required: false
        default: ''
        type: string

concurrency:
  group: etf-active
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run active ETF crawler (統一投信 — 00403A 00981A 00988A)
        id: unipres
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00403A|00981A|00988A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_unipres.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_unipres.py
          fi

      - name: Run active ETF crawler (群益投信 — 00982A 00992A 00997A)
        id: capital
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00982A|00992A|00997A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_capital.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_capital.py
          fi

      - name: Run active ETF crawler (野村投信 — 00980A 00985A 00999A)
        id: nomura
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00980A|00985A|00999A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_nomura.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_nomura.py
          fi

      - name: Set up Node.js (for 元大投信 NUXT parser)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run active ETF crawler (元大投信 — 00990A)
        id: yuanta
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00990A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_yuanta.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_yuanta.py
          fi

      - name: Run active ETF crawler (中信投信 — 00406A 00983A 00995A)
        id: ctbc
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00406A|00983A|00995A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_ctbc.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_ctbc.py
          fi

      - name: Run active ETF crawler (復華投信 — 00991A 00998A)
        id: fuhwa
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00991A|00998A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_fuhwa.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_fuhwa.py
          fi

      - name: Run active ETF crawler (安聯投信 — 00984A 00993A)
        id: allianz
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00984A|00993A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_allianz.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_allianz.py
          fi

      - name: Run active ETF crawler (台新投信 — 00986A 00987A)
        id: taishin
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00986A|00987A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_taishin.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_taishin.py
          fi

      - name: Run active ETF crawler (第一金投信 — 00994A)
        id: first_financial
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00994A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_first_financial.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_first_financial.py
          fi

      - name: Run active ETF crawler (兆豐投信 — 00996A)
        id: mega
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00996A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_mega.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_mega.py
          fi

      - name: Run active ETF crawler (國泰投信 — 00400A)
        id: cathay
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00400A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_cathay.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_cathay.py
          fi

      - name: Run active ETF crawler (富邦投信 — 00405A)
        id: fubon
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            FILTERED=$(echo "${{ inputs.codes }}" | tr ' ' '\n' | grep -E "^(00405A)$" | tr '\n' ' ' | xargs)
            if [ -n "$FILTERED" ]; then
              uv run python etf_Crawler/fetch_active_etf_fubon.py $FILTERED
            else
              echo "SKIPPED=true" >> $GITHUB_OUTPUT
            fi
          else
            uv run python etf_Crawler/fetch_active_etf_fubon.py
          fi

      - name: CMoney API 補漏（官網未更新的 ETF）
        if: always()
        id: cmoney
        continue-on-error: true
        run: uv run python etf_Crawler/fetch_active_etf_cmoney.py

      - name: Job Summary
        if: always()
        run: |
          echo "## 主動型 ETF 持股更新結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| ETF | 投信 | 官網狀態 | 官網日期 | CMoney日期 | 同步 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|---------|-----------|------|" >> $GITHUB_STEP_SUMMARY

          etf_row() {
            local code=$1 issuer=$2 status=$3 off_date=$4 cm_date=$5 step_outcome=$6
            local emoji sync
            case "$status" in
              updated)   emoji="✅ 已更新" ;;
              unchanged) emoji="⏸ 無更新" ;;
              failed)    emoji="❌ 失敗" ;;
              "")
                if [ "$step_outcome" = "failure" ]; then emoji="❌ 失敗"
                else emoji="⏭️ 略過"
                fi ;;
              *) emoji="❓" ;;
            esac
            if [ -z "$cm_date" ]; then
              sync="—"
            elif [ "$off_date" = "$cm_date" ]; then
              sync="✅"
            else
              sync="⚠️ 落差"
            fi
            echo "| $code | $issuer | $emoji | $off_date | $cm_date | $sync |" >> $GITHUB_STEP_SUMMARY
          }

          etf_row "00403A" "統一投信" "${{ steps.unipres.outputs.ETF_00403A_STATUS }}" "${{ steps.unipres.outputs.ETF_00403A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00403A_DATE }}" "${{ steps.unipres.outcome }}"
          etf_row "00981A" "統一投信" "${{ steps.unipres.outputs.ETF_00981A_STATUS }}" "${{ steps.unipres.outputs.ETF_00981A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00981A_DATE }}" "${{ steps.unipres.outcome }}"
          etf_row "00988A" "統一投信" "${{ steps.unipres.outputs.ETF_00988A_STATUS }}" "${{ steps.unipres.outputs.ETF_00988A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00988A_DATE }}" "${{ steps.unipres.outcome }}"
          etf_row "00982A" "群益投信" "${{ steps.capital.outputs.ETF_00982A_STATUS }}" "${{ steps.capital.outputs.ETF_00982A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00982A_DATE }}" "${{ steps.capital.outcome }}"
          etf_row "00992A" "群益投信" "${{ steps.capital.outputs.ETF_00992A_STATUS }}" "${{ steps.capital.outputs.ETF_00992A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00992A_DATE }}" "${{ steps.capital.outcome }}"
          etf_row "00997A" "群益投信" "${{ steps.capital.outputs.ETF_00997A_STATUS }}" "${{ steps.capital.outputs.ETF_00997A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00997A_DATE }}" "${{ steps.capital.outcome }}"
          etf_row "00980A" "野村投信" "${{ steps.nomura.outputs.ETF_00980A_STATUS }}" "${{ steps.nomura.outputs.ETF_00980A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00980A_DATE }}" "${{ steps.nomura.outcome }}"
          etf_row "00985A" "野村投信" "${{ steps.nomura.outputs.ETF_00985A_STATUS }}" "${{ steps.nomura.outputs.ETF_00985A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00985A_DATE }}" "${{ steps.nomura.outcome }}"
          etf_row "00999A" "野村投信" "${{ steps.nomura.outputs.ETF_00999A_STATUS }}" "${{ steps.nomura.outputs.ETF_00999A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00999A_DATE }}" "${{ steps.nomura.outcome }}"
          etf_row "00990A" "元大投信" "${{ steps.yuanta.outputs.ETF_00990A_STATUS }}" "${{ steps.yuanta.outputs.ETF_00990A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00990A_DATE }}" "${{ steps.yuanta.outcome }}"
          etf_row "00406A" "中信投信" "${{ steps.ctbc.outputs.ETF_00406A_STATUS }}" "${{ steps.ctbc.outputs.ETF_00406A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00406A_DATE }}" "${{ steps.ctbc.outcome }}"
          etf_row "00983A" "中信投信" "${{ steps.ctbc.outputs.ETF_00983A_STATUS }}" "${{ steps.ctbc.outputs.ETF_00983A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00983A_DATE }}" "${{ steps.ctbc.outcome }}"
          etf_row "00995A" "中信投信" "${{ steps.ctbc.outputs.ETF_00995A_STATUS }}" "${{ steps.ctbc.outputs.ETF_00995A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00995A_DATE }}" "${{ steps.ctbc.outcome }}"
          etf_row "00991A" "復華投信" "${{ steps.fuhwa.outputs.ETF_00991A_STATUS }}" "${{ steps.fuhwa.outputs.ETF_00991A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00991A_DATE }}" "${{ steps.fuhwa.outcome }}"
          etf_row "00998A" "復華投信" "${{ steps.fuhwa.outputs.ETF_00998A_STATUS }}" "${{ steps.fuhwa.outputs.ETF_00998A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00998A_DATE }}" "${{ steps.fuhwa.outcome }}"
          etf_row "00984A" "安聯投信" "${{ steps.allianz.outputs.ETF_00984A_STATUS }}" "${{ steps.allianz.outputs.ETF_00984A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00984A_DATE }}" "${{ steps.allianz.outcome }}"
          etf_row "00993A" "安聯投信" "${{ steps.allianz.outputs.ETF_00993A_STATUS }}" "${{ steps.allianz.outputs.ETF_00993A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00993A_DATE }}" "${{ steps.allianz.outcome }}"
          etf_row "00986A" "台新投信" "${{ steps.taishin.outputs.ETF_00986A_STATUS }}" "${{ steps.taishin.outputs.ETF_00986A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00986A_DATE }}" "${{ steps.taishin.outcome }}"
          etf_row "00987A" "台新投信" "${{ steps.taishin.outputs.ETF_00987A_STATUS }}" "${{ steps.taishin.outputs.ETF_00987A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00987A_DATE }}" "${{ steps.taishin.outcome }}"
          etf_row "00994A" "第一金投信" "${{ steps.first_financial.outputs.ETF_00994A_STATUS }}" "${{ steps.first_financial.outputs.ETF_00994A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00994A_DATE }}" "${{ steps.first_financial.outcome }}"
          etf_row "00996A" "兆豐投信" "${{ steps.mega.outputs.ETF_00996A_STATUS }}" "${{ steps.mega.outputs.ETF_00996A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00996A_DATE }}" "${{ steps.mega.outcome }}"
          etf_row "00400A" "國泰投信" "${{ steps.cathay.outputs.ETF_00400A_STATUS }}" "${{ steps.cathay.outputs.ETF_00400A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00400A_DATE }}" "${{ steps.cathay.outcome }}"
          etf_row "00405A" "富邦投信" "${{ steps.fubon.outputs.ETF_00405A_STATUS }}" "${{ steps.fubon.outputs.ETF_00405A_DATE }}" "${{ steps.cmoney.outputs.CMONEY_00405A_DATE }}" "${{ steps.fubon.outcome }}"

      - name: Commit & push updated ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/etf/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "主動型 ETF 持股更新 $(date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase -X ours origin main && git push && break
              sleep $((i * 5))
            done
          fi

      - name: Fetch stock_map ETF index.json (for categoryId/issuer)
        continue-on-error: true
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/CHIJUI0128/stock_map/contents/src/data/etf/index.json?ref=publish_cloudflare" \
            -o src/data/etf/index.json
          echo "✅ index.json 已取得（$(jq length src/data/etf/index.json) 筆）"

      - name: Regenerate stock-to-ETF reverse index
        continue-on-error: true
        run: uv run python etf_Crawler/generate_stock_etf_index.py

      - name: Commit & push reverse index
        continue-on-error: true
        run: |
          git add src/data/etf-by-stock/
          if git diff --cached --quiet; then
            echo "No changes to reverse index"
          else
            git commit -m "ETF 個股反向索引更新 $(date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase -X ours origin main && git push && break
              sleep $((i * 5))
            done
          fi

      - name: Fail if any crawler failed
        if: always()
        run: |
          FAILED=""
          check() {
            local name=$1 result=$2 skipped=$3
            if [ "$skipped" != "true" ] && [ "$result" != "success" ]; then
              FAILED="$FAILED $name"
            fi
          }
          check "統一投信" "${{ steps.unipres.outcome }}" "${{ steps.unipres.outputs.SKIPPED }}"
          check "群益投信" "${{ steps.capital.outcome }}" "${{ steps.capital.outputs.SKIPPED }}"
          check "野村投信" "${{ steps.nomura.outcome }}" "${{ steps.nomura.outputs.SKIPPED }}"
          check "元大投信" "${{ steps.yuanta.outcome }}" "${{ steps.yuanta.outputs.SKIPPED }}"
          check "中信投信" "${{ steps.ctbc.outcome }}" "${{ steps.ctbc.outputs.SKIPPED }}"
          check "復華投信" "${{ steps.fuhwa.outcome }}" "${{ steps.fuhwa.outputs.SKIPPED }}"
          check "安聯投信" "${{ steps.allianz.outcome }}" "${{ steps.allianz.outputs.SKIPPED }}"
          check "台新投信" "${{ steps.taishin.outcome }}" "${{ steps.taishin.outputs.SKIPPED }}"
          check "第一金投信" "${{ steps.first_financial.outcome }}" "${{ steps.first_financial.outputs.SKIPPED }}"
          check "兆豐投信" "${{ steps.mega.outcome }}" "${{ steps.mega.outputs.SKIPPED }}"
          check "國泰投信" "${{ steps.cathay.outcome }}" "${{ steps.cathay.outputs.SKIPPED }}"
          check "富邦投信" "${{ steps.fubon.outcome }}" "${{ steps.fubon.outputs.SKIPPED }}"
          if [ -n "$FAILED" ]; then
            echo "❌ 以下投信爬蟲失敗：$FAILED"
            exit 1
          fi
          echo "✅ 所有爬蟲成功"
