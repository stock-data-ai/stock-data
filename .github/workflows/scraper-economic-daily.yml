name: Economic Daily Scraper

on:
  schedule:
    # Daily (Mon-Fri): Taiwan 07:00 & 23:00 (各爬一個主題)
    - cron: '0 23 * * 0-4'    # UTC Sun-Thu 23:00 = TW Mon-Fri 07:00
    - cron: '0 15 * * 1-5'    # UTC Mon-Fri 15:00 = TW Mon-Fri 23:00
  workflow_dispatch:

jobs:
  economic-daily-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Random startup delay (only on schedule)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$((RANDOM % 300))
          echo "Waiting ${DELAY} seconds (0~5 min)..."
          sleep $DELAY

      - name: Run Economic Daily Scraper (Topic Rotation)
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run python -m Web_Crawler.money_udn.init_database --rotate
