name: Economic Daily Scraper｜經濟日報爬蟲

on:
  workflow_dispatch:

jobs:
  economic-daily-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch data files from stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          BASE="https://api.github.com/repos/CHIJUI0128/stock_map/contents"
          REF="?ref=publish_cloudflare"
          HEADERS=(-H "Authorization: token $PAT" -H "Accept: application/vnd.github.v3.raw")
          mkdir -p src/data/layer0 src/data/layer3/companies src/data/layer3/company-topics
          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer0/topics.json$REF"                          -o src/data/layer0/topics.json
          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer3/companies/companies-all.json$REF"         -o src/data/layer3/companies/companies-all.json
          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer3/company-topics/index.json$REF"            -o src/data/layer3/company-topics/index.json
          echo "✅ stock_map 資料檔已取得"

      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Random startup delay
        if: ${{ !inputs.skip_delay }}
        run: |
          DELAY=$((RANDOM % 300))
          echo "Waiting ${DELAY} seconds (0~5 min)..."
          sleep $DELAY

      - name: Run Economic Daily Scraper (Topic Rotation)
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_CRAWLER_DB_ID: ${{ secrets.CLOUDFLARE_CRAWLER_DB_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          uv run python -m Web_Crawler.money_udn.init_database --rotate 2>&1 | tee /tmp/run.log

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          # "本次主題: {name} ({id})" and "進度: N/M" and "主題 [X] 完成: 成功 A, 失敗 B"
          TOPIC=$(grep -oP '本次主題: \K[^\n]+' "$LOG" 2>/dev/null | tail -1 | sed 's/ *$//' || echo "—")
          PROGRESS=$(grep -oP '進度: \K\d+/\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          SUCCESS=$(grep -oP '完成: 成功 \K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          FAIL=$(grep -oP '完成: 成功 \d+, 失敗 \K\d+' "$LOG" 2>/dev/null | tail -1 || echo "—")
          NEXT=$(grep "下次將執行:" "$LOG" 2>/dev/null | sed 's/下次將執行: //' | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 經濟日報爬蟲 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 本次主題 | $TOPIC |"
            echo "| 輪替進度 | $PROGRESS |"
            echo "| 成功公司數 | $SUCCESS |"
            echo "| 失敗公司數 | $FAIL |"
            echo "| 下次主題 | $NEXT |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY
