name: ETF Holdings Update (Weekly)

on:
  schedule:
    # Weekly: Taiwan 08:00 on Saturday (UTC 00:00 Saturday)
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      codes:
        description: '指定 ETF 代碼（空白分隔，留空=全部）'
        required: false
        default: ''
        type: string

concurrency:
  group: etf-holdings
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ETF holdings crawler
        run: |
          if [ -n "${{ inputs.codes }}" ]; then
            uv run python etf_Crawler/fetch_etf_holdings.py ${{ inputs.codes }}
          else
            uv run python etf_Crawler/fetch_etf_holdings.py
          fi

      - name: Commit & push updated ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/etf/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ETF 持股更新 $(date +%Y-%m-%d)"
            git pull --rebase -X ours origin main
            git push
          fi

      - name: Notify stock_map to sync ETF data
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CHIJUI0128/stock_map/dispatches \
            -d '{"event_type":"etf-data-changed"}'

      - name: 開 Issue 提醒本地同步 ETF metadata/index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh label list --repo stock-data-ai/stock-data --search reminder --json name -q '.[].name' | grep -Fxq reminder; then
            gh label create reminder \
              --repo stock-data-ai/stock-data \
              --description "本地同步提醒" \
              --color "FBCA04"
          fi

          gh issue create \
            --repo stock-data-ai/stock-data \
            --title "🔔 [$(date +%Y-%m-%d)] 請本地同步 ETF metadata / index" \
            --body "ETF holdings 已更新完成，請在本地執行：

          \`\`\`bash
          uv run python etf_Crawler/sync_etf_metadata.py
          uv run python etf_Crawler/generate_etf_index.py
          git add src/data/etf/
          git commit -m \"ETF metadata/index 同步 \$(date +%Y-%m-%d)\"
          git push
          \`\`\`

          推送後 stock_map 會再同步最新 index.json。" \
            --label "reminder"
