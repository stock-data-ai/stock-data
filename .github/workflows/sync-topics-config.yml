name: Sync Topics Config from stock_map

on:
  repository_dispatch:
    types: [topics-config-changed]
  workflow_dispatch:

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stock-data
        uses: actions/checkout@v6

      - name: Fetch files from stock_map
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          BASE="https://api.github.com/repos/CHIJUI0128/stock_map/contents"
          HEADERS=(-H "Authorization: token $PAT" -H "Accept: application/vnd.github.v3.raw")
          REF="?ref=publish_cloudflare"
          mkdir -p src/data/layer3/company-lists

          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer0/topics.json$REF" \
            -o src/data/layer0/topics.json

          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer3/company-topics/index.json$REF" \
            -o src/data/layer3/company-topics/index.json

          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer3/company-lists/us.json$REF" \
            -o src/data/layer3/company-lists/us.json

          curl -fsSL "${HEADERS[@]}" "$BASE/src/data/layer3/company-lists/jp.json$REF" \
            -o src/data/layer3/company-lists/jp.json

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Update foreign company info
        run: |
          uv run finance_tools/cli.py update-us-company-info
          uv run finance_tools/cli.py update-jp-company-info

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer0/topics.json \
                  src/data/layer3/company-topics/index.json \
                  src/data/layer3/company-lists/us.json \
                  src/data/layer3/company-lists/jp.json \
                  src/data/layer3/companies/companies-all.json
          if git diff --cached --quiet; then
            echo "無變化，略過 commit。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "sync: 從 stock_map 同步設定檔 $(date -u +%Y-%m-%d)"
          git pull origin main --no-rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger companies data sync in stock_map
        if: steps.commit.outputs.changed == 'true'
        env:
          PAT: ${{ secrets.STOCK_MAP_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CHIJUI0128/stock_map/dispatches \
            -d '{"event_type":"companies-data-changed"}'
