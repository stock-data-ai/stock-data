name: Footprint Collect｜盤中足跡圖資料收集

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '只跑 N 分鐘（測試用，會加 --ignore-hours）'
        required: false
        default: ''
  schedule:
    # 00:30 UTC = 08:30 台北，poller 會自己等到 09:00 開盤
    - cron: '30 0 * * 1-5'

concurrency:
  group: footprint-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v8.0.0
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - run: uv sync --all-extras --dev

      - name: 盤中輪詢收集
        run: |
          ARGS=""
          [ -n "${{ inputs.minutes }}" ] && ARGS="--minutes ${{ inputs.minutes }} --ignore-hours"
          set -o pipefail
          uv run python -m finance_tools.footprint.poller $ARGS 2>&1 | tee /tmp/poller.log

      - name: 上傳原始 JSONL（artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-raw-${{ github.run_id }}
          path: footprint_raw/
          if-no-files-found: warn
          retention-days: 30

      - name: 聚合成 footprint JSON
        if: always()
        run: uv run python -m finance_tools.footprint.aggregator

      - name: 提交變更
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/footprint/
          git diff --cached --quiet && { echo "沒有變更需要提交。"; exit 0; }
          git commit -m "footprint 足跡圖資料 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && break
            sleep $((i * 5))
          done

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "## Footprint 收集｜$(TZ=Asia/Taipei date +%Y-%m-%d)"
            echo '```'
            tail -5 /tmp/poller.log 2>/dev/null || echo "（無 poller log）"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
