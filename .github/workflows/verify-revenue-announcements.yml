name: Verify Revenue Announcements｜月營收月中核對

# 每月 15～25 號 09:00 由 cron worker 派（見 cron/src/index.ts）。開放資料一換到上個月就核對、
# 修正月份檔並寄結果信（相符或有問題都寄）；已核對過的月份直接結束。到 25 號還沒更新也寄信。
on:
  workflow_dispatch:

concurrency:
  group: revenue-announcements
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 結束碼 3＝檔已寫好但結果信寄送失敗：先 commit，最後一步再讓 job 變紅
      - name: Verify against official open data
        id: verify
        env:
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
        run: |
          set +e
          uv run finance_tools/cli.py verify-revenue-announcements 2>&1 | tee /tmp/run.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "## 月營收月中核對 — $(TZ=Asia/Taipei date +%Y-%m-%d)"
            echo ""
            grep -E '核對完成|尚未換到|已在 .* 核對過|14 號以前|❌' /tmp/run.log | sed 's/.* - INFO - //; s/.* - ERROR - //' | sed 's/^/- /'
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always() && (steps.verify.outputs.code == '0' || steps.verify.outputs.code == '3')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/revenue-announcements/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "月營收月中核對 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Retry $i failed, sleeping..."
            sleep $((i * 5))
          done
          echo "::error::推送失敗三次，核對結果沒有發布出去"
          exit 1

      - name: 結果信寄送失敗
        if: steps.verify.outputs.code == '3'
        run: |
          echo "::error::核對已完成並 commit，但結果信沒寄出去"
          exit 1
