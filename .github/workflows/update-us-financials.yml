name: Update US Financials｜美股財務更新

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '指定 ticker（空白=全量，多個用空格分隔，e.g. ARM NVDA）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch US financials
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            uv run finance_tools/us_financials/fetch_us_financials.py ${{ github.event.inputs.codes }} 2>&1 | tee /tmp/run.log
          else
            uv run finance_tools/us_financials/fetch_us_financials.py --all-topics --delay 1.5 2>&1 | tee /tmp/run.log
          fi

      - name: 執行摘要
        if: always()
        run: |
          LOG=/tmp/run.log
          # "Done: X saved, Y skipped, Z errors → ..."
          SAVED=$(grep -oP 'Done: \K\d+(?= saved)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          SKIPPED=$(grep -oP '\d+(?= skipped)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          ERRORS=$(grep -oP '\d+(?= errors)' "$LOG" 2>/dev/null | tail -1 || echo "—")
          STATUS=$( [ "${{ job.status }}" = "success" ] && echo "✅ 成功" || echo "❌ 失敗" )
          {
            echo "## 美股財務更新 — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| 指標 | 值 |"
            echo "|------|---|"
            echo "| 儲存 | $SAVED |"
            echo "| 跳過 | $SKIPPED |"
            echo "| 錯誤 | $ERRORS |"
            echo "| 狀態 | $STATUS |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/layer3/company-financials-us/
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每週更新美股財務資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep $((i * 5))
          done
