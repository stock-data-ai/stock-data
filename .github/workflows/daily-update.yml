name: Daily Update

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task identifier (for rerun chaining)'
        required: false
        default: 'daily'
        type: string
      rerun_round:
        description: 'Rerun round (auto-set by self-chaining, 0=initial run)'
        required: false
        default: '0'
        type: string
      delay_minutes:
        description: 'Minutes to wait before start (for API quota reset)'
        required: false
        default: '0'
        type: string
      batch:
        description: 'Batch number (0=all batches, 1-4=specific batch)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Force update even if already updated today'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pipeline:
    uses: ./.github/workflows/_reusable-data-job.yml
    with:
      commands_json: '[{"id":"daily","cli":"update-daily","label":"每日更新(市值+法人+資券)"}]'
      artifact_prefix: daily

      commit_message: "每日更新三大法人+市值+融資融券數據"
      caller_workflow: daily-update.yml
      caller_task: daily
      summary_title: "每日更新"
      rerun_round: ${{ inputs.rerun_round || '0' }}
      delay_minutes: ${{ inputs.delay_minutes || '0' }}
      batch: ${{ inputs.batch || '0' }}
      force: ${{ github.event_name == 'schedule' || inputs.force || false }}
      rerun_delay_minutes: '15'
    secrets: inherit

  market-sentiment:
    needs: pipeline
    if: always() && needs.pipeline.result != 'skipped' && (inputs.rerun_round == '0' || inputs.rerun_round == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Update market sentiment
        run: uv run finance_tools/cli.py update-market-sentiment

      - name: Commit sentiment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market/sentiment.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "每日更新市場情緒數據 $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
