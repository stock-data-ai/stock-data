name = "stock-data-cron"
main = "src/index.ts"
compatibility_date = "2024-01-29"

# Cloudflare day-of-week: 1=Sun 2=Mon 3=Tue 4=Wed 5=Thu 6=Fri 7=Sat
# Ranges (e.g. 1-5) are NOT supported — use comma-separated values only

[triggers]
crons = [
  "0 0 * * 7",            # etf-holdings-update       台灣 08:00 週六
  # 股權分散／大戶加碼：主班＋三班備援，備援班本週已成功就跳過（見 src/index.ts）
  "0 1 * * 7",            # weekly-shareholder-update 台灣 09:00 週六（主班）
  "0 4 * * 7",            # weekly-shareholder-update 台灣 12:00 週六（備援）
  "0 8 * * 7",            # weekly-shareholder-update 台灣 16:00 週六（備援）
  "30 0 * * 1",           # weekly-shareholder-update 台灣 08:30 週日（最後一班，失敗即寄信）
  "0 2 * * 7",            # weekly-insider-holdings   台灣 10:00 週六（主班）
  "20 2 * * 1",           # weekly-insider-holdings   台灣 10:20 週日（備援，失敗即寄信）
  "1 1 * * 1",            # weekly-financials-update  台灣 09:01 週日
  "0 2 * * 1",            # update-us-financials      台灣 10:00 週日
  "0 3 * * 7",            # weekly-dividend-update    台灣 11:00 週六
  "0 3 * * 1",            # weekly-balance-sheet      台灣 11:00 週日
  "0 8 * * *",            # etf-active-daily          台灣 16:00 每天（第一次）
  "55 7 * * 2,3,4,5,6",  # market-sentiment          台灣 15:55 週一到週五（第一次）
  "55 8 * * 2,3,4,5,6",  # market-sentiment          台灣 16:55 週一到週五（第二次）
  "55 9 * * *",           # etf-active-daily          台灣 17:55 每天（第二次）
  # 平日每日更新（三大法人）與融資融券：每 10 分鐘問 FinMind 今天的資料有了沒，有了才 dispatch
  # （不開 Actions、一個請求不到 1KB；到 deadline 21:00／22:30 照派一班）。籌碼題材接在每日更新成功之後
  # （workflow_run）。取代原本猜時間的 19:30＋21:05、19:45、21:30 四班，見 src/index.ts 的 WAIT_JOBS。
  "0,10,20,30,40,50 9,10,11,12,13,14 * * 2,3,4,5,6", # 等資料到齊  台灣 17:00–22:50 週一到週五，每 10 分
  # 週六只撿 FinMind 外資持股的補正（週五資料晚一天定案），沒有「今天」可等，維持固定一班。
  "30 11 * * 7",          # daily-update             台灣 19:30 週六
  "0 4 * * *",            # scraper-mops              台灣 12:00 每天（午間刷新）
  "0 9 * * *",            # scraper-mops              台灣 17:00 每天（盤後刷新）
  "0 12 * * *",           # scraper-mops              台灣 20:00 每天（20:30 通知前刷新）
  "55 12 * * 2,3,4,5,6", # market-sentiment          台灣 20:55 週一到週五（第三次）
  "0 13 * * *",           # etf-active-daily          台灣 21:00 每天（第三次）＝推播那輪，見 src/index.ts 註解
  "05 11 * * 2,3,4,5,6", # generate-disposition-forecast 台灣 19:05 週一到週五（第一次）
  "30 14 * * 2,3,4,5,6", # generate-disposition-forecast 台灣 22:30 週一到週五（備援，補款7；提前到 23:00 健康檢查之前才蓋得到）
  "55 13 * * 2,3,4,5,6", # market-sentiment          台灣 21:55 週一到週五（第四次，融資融券公布後）
  "0 19 * * 1",           # cleanup-workflow-runs     台灣 03:00 週一（CF 1=Sun, UTC Sun 19:00 = TW Mon 03:00）
  "0 15 * * *",           # health-check              台灣 23:00 每天
]
